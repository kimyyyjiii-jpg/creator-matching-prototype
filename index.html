<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>크리에이터 매칭 추천</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>크리에이터 매칭 추천</h1>
      <p>예산 안에서 집행 가능한 크리에이터를 캠페인 목적에 맞춰 추천해요.</p>
    </header>

    <main class="layout">
      <form id="condition-form" class="panel form" novalidate>
        <fieldset class="field">
          <legend>1인당 예산 <span class="req">필수</span></legend>
          <div class="budget">
            <input id="budget" name="budget" type="text" inputmode="numeric" autocomplete="off" placeholder="예: 1500000" aria-describedby="budget-readable budget-error" />
            <span class="budget__unit">원</span>
          </div>
          <p id="budget-readable" class="hint" aria-live="polite"></p>
          <p id="budget-error" class="error" role="alert" hidden></p>
          <p class="hint">크리에이터 1명과 진행하는 캠페인 1건의 예산</p>
        </fieldset>

        <fieldset class="field">
          <legend>카테고리 <span class="req">필수</span> <span class="hint-inline">여러 개 선택 가능</span></legend>
          <div id="category-chips" class="chips"></div>
        </fieldset>

        <fieldset class="field">
          <legend>팔로워 규모 <span class="req">필수</span> <span class="hint-inline" id="range-readable"></span></legend>
          <div class="range" id="range">
            <div class="range__track"><div class="range__fill" id="range-fill"></div></div>
            <input type="range" id="range-min" min="0" max="2" step="1" value="0" aria-label="팔로워 규모 시작" />
            <input type="range" id="range-max" min="0" max="2" step="1" value="2" aria-label="팔로워 규모 끝" />
          </div>
          <ol class="range__labels" id="range-labels"></ol>
        </fieldset>

        <fieldset class="field">
          <legend>플랫폼 <span class="opt">선택</span></legend>
          <div id="platform-options" class="segmented"></div>
        </fieldset>

        <fieldset class="field">
          <legend>캠페인 목적 <span class="opt">선택</span></legend>
          <div id="purpose-options" class="purpose"></div>
        </fieldset>

        <button type="submit" class="submit" id="submit-btn" disabled>추천받기</button>
        <p class="hint center">조건을 바꾼 뒤에는 추천받기를 다시 눌러야 결과에 반영돼요.</p>
      </form>

      <section id="results" class="results" aria-live="polite">
        <div class="placeholder">데이터를 불러오는 중…</div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
